<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Letter For You ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "DM Sans", sans-serif;

      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.10), transparent 30%),
        linear-gradient(135deg, #6f4b8b, #9b73b5, #60427d);
    }


    /* MAIN CONTAINER */

    .container {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      position: relative;
    }


    /* INSTRUCTION */

    .instruction {
      color: rgba(255,255,255,0.85);

      font-size: 14px;
      letter-spacing: 2px;

      margin-bottom: 40px;

      transition: opacity 0.5s ease;

      animation: fadeIn 1s ease;
    }

    .instruction.hide {
      opacity: 0;
      pointer-events: none;
    }


    /* ENVELOPE WRAPPER */

    .envelope-wrapper {
      position: relative;

      width: 280px;
      height: 180px;

      cursor: pointer;

      transition:
        opacity 0.8s ease,
        transform 0.3s ease;
    }

    .envelope-wrapper:hover {
      transform: translateY(-6px);
    }

    .envelope-wrapper.opened {
      cursor: default;
    }


    /* PAPER */

    .paper {
      position: absolute;

      width: min(85vw, 420px);
      height: min(68vh, 570px);

      background: #fffdf8
