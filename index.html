<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Letter For You ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;

      font-family: "DM Sans", sans-serif;

      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.10), transparent 30%),
        linear-gradient(135deg, #6f4b8b, #9b73b5, #60427d);

      display: flex;
      justify-content: center;
      align-items: center;
    }


    .container {
      text-align: center;
      position: relative;
    }


    /* instruction */

    .instruction {
      color: rgba(255,255,255,0.85);

      font-size: 14px;

      letter-spacing: 2px;

      margin-bottom: 40px;

      animation: fadeIn 1.5s ease;
    }


    /* envelope */

    .envelope {
      width: 280px;
      height: 180px;

      position: relative;

      margin: auto;

      cursor: pointer;

      filter: drop-shadow(0 15px 20px rgba(0,0,0,0.25));

      transition: transform 0.3s ease;

      animation: appear 1s ease;
    }


    .envelope:hover {
      transform: translateY(-8px) scale(1.02);
    }


    /* back of envelope */

    .envelope-body {
      width: 100%;
      height: 100%;

      background: #f3e5d5;

      position: absolute;

      overflow: hidden;

      border-radius: 3px;
    }


    /* top flap */

    .flap {
      position: absolute;

      top: 0;
      left: 0;

      width: 0;
      height: 0;

      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-top: 90px solid #e6d2be;

      z-index: 3;

      transform-origin: top;

      transition: 0.8s ease;
    }


    /* left fold */

    .left-fold {
      position: absolute;

      width: 0;
      height: 0;

      border-top: 90px solid transparent;
      border-bottom: 90px solid transparent;
      border-left: 140px solid #ead9c8;

      left: 0;

      z-index: 2;
    }


    /* right fold */

    .right-fold {
      position: absolute;

      width: 0;
      height: 0;

      border-top: 90px solid transparent;
      border-bottom: 90px solid transparent;
      border-right: 140px solid #e1cbb6;

      right: 0;

      z-index: 2;
    }


    /* bottom fold */

    .bottom-fold {
      position: absolute;

      width: 0;
      height: 0;

      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-bottom: 90px solid #f7ecdf;

      bottom: 0;

      z-index: 3;
    }


    /* heart seal */

    .seal {
      position: absolute;

      top: 68px;
      left: 50%;

      transform: translateX(-50%);

      width: 38px;
      height: 38px;

      border-radius: 50%;

      background: #8b5ca5;

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;

      z-index: 5;

      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }


    /* sparkles */

    .sparkle {
      position: fixed;

      color: white;

      animation: sparkle 3s infinite ease-in-out;

      pointer-events: none;
    }


    .sparkle1 {
      top: 18%;
      left: 15%;
      font-size: 18px;
    }


    .sparkle2 {
      top: 28%;
      right: 17%;
      font-size: 13px;
      animation-delay: 1s;
    }


    .sparkle3 {
      bottom: 20%;
      left: 18%;
      font-size: 16px;
      animation-delay: 2s;
    }


    .sparkle4 {
      bottom: 15%;
      right: 15%;
      font-size: 20px;
      animation-delay: 0.5s;
    }


    /* animations */

    @keyframes fadeIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }


    @keyframes appear {

      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    @keyframes sparkle {

      0%, 100% {
        opacity: 0.3;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
      }

    }

  </style>

</head>


<body>


  <!-- sparkles -->

  <div class="sparkle sparkle1">✦</div>
  <div class="sparkle sparkle2">✧</div>
  <div class="sparkle sparkle3">✦</div>
  <div class="sparkle sparkle4">✧</div>


  <div class="container">


    <p class="instruction">
      tap the envelope ♡
    </p>


    <!-- envelope -->

    <div class="envelope" onclick="openEnvelope()">


      <div class="envelope-body"></div>

      <div class="flap"></div>

      <div class="left-fold"></div>

      <div class="right-fold"></div>

      <div class="bottom-fold"></div>

      <div class="seal">♡</div>


    </div>


  </div>


  <script>

    function openEnvelope() {

      alert("the envelope will open next ♡");

    }

  </script>


</body>
</html>
